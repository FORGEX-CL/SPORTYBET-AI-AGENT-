<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e30613" />
    <meta name="description" content="SportyBet AI Agent — SportyBet-source sports analysis dashboard." />
    <title>SportyBet AI Agent</title>
  </head>
  <body>
    <div id="app">
      <main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;background:#f4f5f7">
        <section style="max-width:520px;background:#fff;border:1px solid #ddd;border-top:4px solid #e30613;border-radius:8px;padding:24px;text-align:center">
          <strong>SPORTYBET AI AGENT</strong>
          <p id="startup-status" style="color:#666">Starting application…</p>
        </section>
      </main>
    </div>
    <script>
      (function(){
        function showStartupError(message){
          var app=document.getElementById("app");
          if(!app)return;
          app.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;background:#f4f5f7"><section style="max-width:560px;background:#fff;border:1px solid #ddd;border-top:4px solid #e30613;border-radius:8px;padding:24px"><h2 style="margin:0 0 10px">SPORTYBET AI AGENT</h2><p style="color:#b42318;line-height:1.5">The application failed during startup.</p><small style="color:#666;word-break:break-word">'+String(message||"Unknown startup error").replace(/[&<>]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]})+'</small></section></main>';
        }
        window.addEventListener("error",function(event){showStartupError(event&&event.error&&event.error.message||event&&event.message||"JavaScript startup error");});
        window.addEventListener("unhandledrejection",function(event){showStartupError(event&&event.reason&&event.reason.message||event&&event.reason||"Unhandled startup rejection");});
      }());
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
